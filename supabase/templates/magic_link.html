<!DOCTYPE html>
<html>
  <body style="font-family: system-ui, sans-serif; line-height: 1.5; color: #0f172a">

    <p>Enter this 6-digit code in the app to sign in:</p>
    <p style="font-size: 22px; font-weight: 600; letter-spacing: 0.12em">{{ .Token }}</p>

    </p>
